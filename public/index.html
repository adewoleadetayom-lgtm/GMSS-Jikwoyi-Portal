<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMSS Jikwoyi Portal</title>
<style>
:root{--p:#7800b5;--p2:#4d0074;--bg:#f5f2f7;--ink:#25192c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff}.nav{max-width:1200px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}.brand h1{font-size:20px;margin:0}.brand small{opacity:.9}.spacer{flex:1}.hamb{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:9px 12px;font-size:20px}.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:bold}.btn.light{background:#fff;color:var(--p)}.btn.gray{background:#eee;color:#222}.btn.red{background:#c62828}.layout{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:235px 1fr;gap:18px}.side{background:#fff;border-radius:16px;padding:12px;height:max-content;position:sticky;top:85px}.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px;border-radius:9px}.side button:hover{background:#f4e7fa;color:var(--p);font-weight:bold}.card{background:#fff;border-radius:17px;padding:20px;margin-bottom:18px;box-shadow:0 4px 16px #0000000b}.hero{background:linear-gradient(135deg,var(--p2),#a100df);color:#fff;border-radius:20px;padding:25px;display:flex;align-items:center;gap:20px;margin-bottom:18px}.hero img{width:105px;height:105px;object-fit:contain;background:#fff;border-radius:16px;padding:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fbf6fd;border:1px solid #ead9f1;border-radius:14px;padding:18px}.stat b{font-size:28px;color:var(--p)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}input,textarea,select{border:1px solid #d7cedb;border-radius:9px;padding:11px;background:#fff}textarea{min-height:110px}.item{border:1px solid #e6dfe9;border-radius:12px;padding:14px;margin:10px 0}.badge{display:inline-block;background:#eee;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:bold}.green{background:#dcfce7;color:#166534}.redbadge{background:#fee2e2;color:#991b1b}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.auth{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:20px}.authbox{background:#fff;width:min(470px,100%);padding:25px;border-radius:20px;text-align:center;box-shadow:0 10px 30px #0002}.authbox .logo{width:100px;height:100px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;right:18px;background:#222;color:#fff;padding:13px 17px;border-radius:10px;display:none;z-index:50}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:12px}.side{display:none;position:fixed;left:10px;right:10px;top:78px;z-index:15}.side.open{display:block}.grid,.form{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}.full{grid-column:auto}.brand small{display:none}}
</style>
<style id="professional-upgrade">
/* ===== PROFESSIONAL MOBILE PORTAL UPGRADE ===== */
:root{
 --p:#6500a8;
 --p2:#3d0068;
 --p3:#8d19c7;
 --bg:#f4f5f9;
 --card:#ffffff;
 --ink:#20152a;
 --muted:#756b7c;
 --line:#e9e4ed;
 --success:#159447;
 --danger:#d9363e;
}

body{
 background:linear-gradient(180deg,#f7f5fa 0,#f1f3f8 100%);
 color:var(--ink);
}

.top{
 box-shadow:0 3px 18px #26003822;
}

.nav{
 max-width:1280px;
 min-height:72px;
 padding:8px 18px;
}

.logo{
 box-shadow:0 2px 8px #00000018;
}

.brand h1{
 letter-spacing:.4px;
 font-weight:800;
}

.layout{
 max-width:1280px;
 padding:22px;
 grid-template-columns:250px minmax(0,1fr);
 gap:22px;
}

.side{
 border:1px solid var(--line);
 box-shadow:0 8px 25px #2b123d0b;
 padding:10px;
}

.side button{
 font-weight:600;
 color:#554b5d;
 margin:3px 0;
 transition:.2s;
}

.side button:hover{
 transform:translateX(3px);
}

.card{
 border:1px solid var(--line);
 box-shadow:0 8px 30px #29103c0a;
}

.hero{
 min-height:190px;
 box-shadow:0 12px 30px #57008c25;
}

.hero h1{
 font-size:30px;
 margin-bottom:8px;
}

.grid{
 gap:16px;
}

.stat{
 position:relative;
 overflow:hidden;
 min-height:105px;
 background:linear-gradient(145deg,#fff,#faf5fd);
 box-shadow:0 4px 15px #2a0b3d08;
}

.stat:after{
 content:"";
 position:absolute;
 width:75px;
 height:75px;
 right:-25px;
 top:-25px;
 border-radius:50%;
 background:#7b0ab817;
}

.stat b{
 position:relative;
 z-index:1;
 font-size:30px;
}

.btn{
 box-shadow:0 4px 10px #6500a81f;
 transition:.2s;
}

.btn:hover{
 transform:translateY(-1px);
 box-shadow:0 6px 15px #6500a830;
}

.item{
 background:#fff;
 box-shadow:0 3px 12px #250d3508;
 transition:.2s;
}

.item:hover{
 border-color:#d8b8e7;
}

.badge{
 border:1px solid #ddd5e2;
}

.authbox{
 border:1px solid var(--line);
 box-shadow:0 18px 50px #25052f18;
}

.authbox h2{
 color:var(--p2);
 font-size:28px;
}

/* Admin dashboard */
#main .card h2,
#main .card h3{
 letter-spacing:.1px;
}

#main .card:first-child{
 overflow:hidden;
}

#main table th{
 background:#faf7fc;
 color:#55475e;
 font-size:13px;
 white-space:nowrap;
}

#main table td{
 vertical-align:middle;
}

#main table tr:hover td{
 background:#fcf9fd;
}

/* admin action buttons */
#main .btn.gray{
 border:1px solid #ddd8e1;
}

#main .btn.red{
 background:linear-gradient(135deg,#c62828,#e04747);
}

/* Make long URLs/messages safe */
td, .item, p{
 overflow-wrap:anywhere;
}

/* Mobile */
@media(max-width:800px){
 body{
   padding-bottom:72px;
 }

 .top{
   position:sticky;
   top:0;
 }

 .nav{
   min-height:64px;
   padding:7px 10px;
 }

 .nav .logo{
   width:45px;
   height:45px;
   border-radius:10px;
 }

 .hamb{
   padding:7px 10px;
   font-size:19px;
 }

 .brand h1{
   font-size:16px;
 }

 .who{
   display:none;
 }

 .layout{
   display:block;
   padding:11px;
 }

 .side{
   position:fixed;
   left:8px;
   right:8px;
   top:70px;
   bottom:auto;
   max-height:calc(100vh - 90px);
   overflow:auto;
   z-index:100;
   box-shadow:0 15px 40px #0003;
   border-radius:16px;
 }

 .side button{
   padding:14px;
   font-size:15px;
 }

 .card{
   padding:15px;
   border-radius:15px;
   margin-bottom:13px;
 }

 .hero{
   padding:20px 15px;
   min-height:0;
   border-radius:17px;
 }

 .hero img{
   width:82px;
   height:82px;
 }

 .hero h1{
   font-size:23px;
 }

 .grid{
   grid-template-columns:repeat(2,1fr);
   gap:10px;
 }

 .stat{
   min-height:92px;
   padding:14px;
 }

 .stat b{
   font-size:24px;
 }

 .form{
   grid-template-columns:1fr;
 }

 .full{
   grid-column:auto;
 }

 input,textarea,select{
   width:100%;
   min-height:45px;
 }

 .btn{
   min-height:43px;
 }

 .table{
   margin:0 -4px;
   border-radius:10px;
   overflow-x:auto;
 }

 table{
   min-width:650px;
 }

 #main .card:nth-child(1) .grid{
   grid-template-columns:repeat(3,1fr);
 }

 /* Admin mobile cards */
 #main .card{
   word-break:normal;
 }

 /* turn the sidebar into a mobile drawer */
 .side.open{
   animation:drawer .18s ease-out;
 }

 @keyframes drawer{
   from{opacity:0;transform:translateY(-8px)}
   to{opacity:1;transform:translateY(0)}
 }
}

@media(max-width:430px){
 .grid,
 #main .card:nth-child(1) .grid{
   grid-template-columns:1fr 1fr;
 }

 .hero h1{
   font-size:21px;
 }

 .brand h1{
   font-size:14px;
 }

 .auth{
   padding:12px;
 }

 .authbox{
   padding:18px;
 }
}

/* Desktop sidebar active feel */
.side button:active{
 background:#f0def8;
 color:var(--p);
}

/* Profile */
#main img.logo{
 border:1px solid #e2d7e7;
}

/* Clean scrollbars */
::-webkit-scrollbar{
 width:8px;
 height:8px;
}
::-webkit-scrollbar-thumb{
 background:#c8b7cf;
 border-radius:20px;
}
</style>
</head><body>
<header class="top"><div class="nav"><button class="hamb" onclick="menu()">☰</button><img class="logo" src="/school-logo.jpg"><div class="brand"><h1>GMSS JIKWOYI</h1><small>Knowledge sets you on Eagle's wing</small></div><div class="spacer"></div><span id="who"></span><button id="loginBtn" class="btn light" onclick="showAuth()">Login</button></div></header>
<section id="auth" class="auth hidden"><div class="authbox"><img class="logo" src="/school-logo.jpg"><h2 id="authTitle">Welcome</h2><p>Government Secondary School Jikwoyi Portal</p>
<div id="loginBox"><div class="field"><label>Email</label><input id="le" type="email"></div><br><div class="field"><label>Password</label><input id="lp" type="password"></div><br><button class="btn" onclick="doLogin()">Sign in</button><p>New student? <button class="btn gray" onclick="switchMode('register')">Create account</button></p></div>
<div id="regBox" class="hidden"><div class="form"><div class="field"><label>Full name</label><input id="rn"></div><div class="field"><label>Class</label><input id="rc" placeholder="JSS 1A"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Phone</label><input id="rp"></div><div class="field full"><label>Password</label><input id="rpass" type="password"></div></div><br><button class="btn" onclick="doRegister()">Register</button><p>Already registered? <button class="btn gray" onclick="switchMode('login')">Login</button></p></div>
</div></section>
<div id="app" class="layout hidden"><aside id="side" class="side"><button onclick="page('home')">🏠 Home</button><button onclick="page('profile')">👤 My Profile</button><button onclick="page('ann')">📢 Announcements</button><button onclick="page('lib')">📚 Library</button><button onclick="page('contact')">✉️ Contact Us</button><button id="adminLink" class="hidden" onclick="page('admin')">⚙️ Admin Panel</button><button onclick="logout()">🚪 Logout</button></aside><main id="main"></main></div><div id="toast" class="toast"></div>
<script>
let ME=null,LIB=[];const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json",...(o.headers||{})},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function toast(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2800)}
function menu(){$("side").classList.toggle("open")}function showAuth(){$("auth").classList.remove("hidden");$("app").classList.add("hidden")}function switchMode(m){$("loginBox").classList.toggle("hidden",m!="login");$("regBox").classList.toggle("hidden",m!="register");$("authTitle").textContent=m=="login"?"Welcome back":"Create your account"}
async function doLogin(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("le").value,password:$("lp").value})});ME=d.user;start();toast("Login successful")}catch(e){toast(e.message)}}
async function doRegister(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({name:$("rn").value,className:$("rc").value,email:$("re").value,phone:$("rp").value,password:$("rpass").value})});ME=d.user;start();toast("Account created")}catch(e){toast(e.message)}}
async function logout(){await api("/api/logout",{method:"POST"});location.reload()}
function start(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=ME.name;$("loginBtn").textContent="Online";$("adminLink").classList.toggle("hidden",ME.role!="admin");page("home")}
async function boot(){try{let d=await api("/api/me");if(d.user){ME=d.user;start();return}}catch{}showAuth()}boot()
function page(p){menu();({home,profile,ann,lib,contact,admin}[p]||home)()}
async function home(){let a=await api("/api/announcements");$("main").innerHTML=`<div class="hero"><img src="/school-logo.jpg"><div><h1>Welcome, ${esc(ME.name)}</h1><p>GMSS Jikwoyi School Portal</p><button class="btn light" onclick="page('ann')">View announcements</button></div></div><div class="grid"><div class="stat"><b>${a.length}</b><br>Announcements</div><div class="stat"><b>${ME.role}</b><br>Account role</div><div class="stat"><b>✓</b><br>Portal active</div></div><div class="card"><h2>Latest announcement</h2>${a[0]?`<h3>${esc(a[0].title)}</h3><p>${esc(a[0].body)}</p>`:"<p>No announcements yet.</p>"}</div>`}
function profile(){$("main").innerHTML=`<div class="card"><h2>My Profile</h2><div style="display:flex;gap:15px;align-items:center"><img class="logo" src="${ME.photo||"/school-logo.jpg"}"><div><b>${esc(ME.name)}</b><p>${esc(ME.email)}</p><input type="file" id="photo" accept="image/*"><button class="btn" onclick="photo()">Upload photo</button></div></div><hr><div class="form"><div class="field"><label>Name</label><input id="pn" value="${esc(ME.name)}"></div><div class="field"><label>Class</label><input id="pc" value="${esc(ME.className)}"></div><div class="field"><label>Phone</label><input id="pp" value="${esc(ME.phone)}"></div></div><br><button class="btn" onclick="saveProfile()">Save changes</button></div>`}
async function saveProfile(){try{let d=await api("/api/profile",{method:"PUT",body:JSON.stringify({name:$("pn").value,className:$("pc").value,phone:$("pp").value})});ME=d.user;$("who").textContent=ME.name;toast("Profile saved")}catch(e){toast(e.message)}}
async function photo(){let f=$("photo").files[0];if(!f)return toast("Choose a photo");let fd=new FormData();fd.append("photo",f);let r=await fetch("/api/profile/photo",{method:"POST",body:fd}),d=await r.json();if(!r.ok)return toast(d.error);ME=d.user;profile();toast("Photo updated")}
async function ann(){let a=await api("/api/announcements");$("main").innerHTML=`<div class="card"><h2>📢 Announcements</h2>${a.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small>${new Date(x.createdAt).toLocaleString()} · ${esc(x.author)}</small></div>`).join("")||"<p>No announcements.</p>"}</div>`}
async function lib(){LIB=await api("/api/library");$("main").innerHTML=`<div class="card"><h2>📚 School Library</h2><input id="search" placeholder="Search..." oninput="filterLib()"><div id="libs"></div></div>`;filterLib()}
function filterLib(){let q=($("search").value||"").toLowerCase();$("libs").innerHTML=LIB.filter(x=>(x.title+" "+x.description+" "+x.category).toLowerCase().includes(q)).map(x=>`<div class="item"><span class="badge">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${x.url?`<a class="btn" href="${esc(x.url)}" target="_blank">Open</a>`:""}</div>`).join("")||"<p>No resources found.</p>"}
function contact(){$("main").innerHTML=`<div class="card"><h2>✉️ Contact Us</h2><div class="form"><div class="field"><label>Name</label><input id="cn" value="${esc(ME.name)}"></div><div class="field"><label>Email</label><input id="ce" value="${esc(ME.email)}"></div><div class="field full"><label>Subject</label><input id="cs"></div><div class="field full"><label>Message</label><textarea id="cm"></textarea></div></div><br><button class="btn" onclick="sendMsg()">Send message</button></div>`}
async function sendMsg(){try{await api("/api/messages",{method:"POST",body:JSON.stringify({name:$("cn").value,email:$("ce").value,subject:$("cs").value,message:$("cm").value})});$("cm").value="";toast("Message sent to administration")}catch(e){toast(e.message)}}
async function admin(){if(ME.role!="admin")return toast("Admin only");let [s,u,a,l,m]=await Promise.all([api("/api/admin/stats"),api("/api/admin/users"),api("/api/announcements"),api("/api/library"),api("/api/messages")]);$("main").innerHTML=`<div class="card"><h2>⚙️ Real Administrator Panel</h2><div class="grid"><div class="stat"><b>${s.users}</b><br>Total users</div><div class="stat"><b>${s.announcements}</b><br>Announcements</div><div class="stat"><b>${s.unreadMessages}</b><br>Unread messages</div></div></div><div class="card"><h3>Publish announcement</h3><div class="field"><label>Title</label><input id="at"></div><br><div class="field"><label>Text</label><textarea id="ab"></textarea></div><br><button class="btn" onclick="addAnn()">Publish</button></div><div class="card"><h3>Add library resource</h3><div class="form"><div class="field"><label>Title</label><input id="lt"></div><div class="field"><label>Category</label><input id="lc" value="General"></div><div class="field full"><label>Description</label><textarea id="ld"></textarea></div><div class="field full"><label>URL</label><input id="lu" placeholder="https://..."></div></div><br><button class="btn" onclick="addLib()">Add</button></div><div class="card"><h3>Manage users</h3><div class="table"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td><td>${x.status}</td><td>${x.email=="admin@gmssjikwoyi.edu.ng"?"Main admin":`<button class="btn gray" onclick="toggleUser('${x.id}','${x.status=="active"?"disabled":"active"}')">${x.status=="active"?"Disable":"Enable"}</button> <button class="btn red" onclick="delUser('${x.id}')">Delete</button>`}</td></tr>`).join("")}</table></div></div><div class="card"><h3>Manage announcements</h3>${a.map(x=>`<div class="item"><b>${esc(x.title)}</b><button class="btn red" style="float:right" onclick="delAnn('${x.id}')">Delete</button><p>${esc(x.body)}</p></div>`).join("")||"None"}</div><div class="card"><h3>Manage library</h3>${l.map(x=>`<div class="item"><b>${esc(x.title)}</b><button class="btn red" style="float:right" onclick="delLib('${x.id}')">Delete</button></div>`).join("")||"None"}</div><div class="card"><h3>Contact messages</h3>${m.map(x=>`<div class="item"><span class="badge ${x.status=="unread"?"redbadge":"green"}">${x.status}</span><h3>${esc(x.subject||"No subject")}</h3><p>${esc(x.message)}</p><small>${esc(x.name)} · ${esc(x.email)}</small><br><button class="btn gray" onclick="readMsg('${x.id}')">Mark read</button> <button class="btn red" onclick="delMsg('${x.id}')">Delete</button></div>`).join("")||"No messages."}</div>`}
async function addAnn(){try{await api("/api/announcements",{method:"POST",body:JSON.stringify({title:$("at").value,body:$("ab").value})});toast("Published");admin()}catch(e){toast(e.message)}}
async function addLib(){try{await api("/api/library",{method:"POST",body:JSON.stringify({title:$("lt").value,category:$("lc").value,description:$("ld").value,url:$("lu").value})});toast("Added");admin()}catch(e){toast(e.message)}}
async function toggleUser(id,status){try{await api("/api/admin/users/"+id,{method:"PATCH",body:JSON.stringify({status})});admin()}catch(e){toast(e.message)}}
async function delUser(id){if(confirm("Delete this user?")){await api("/api/admin/users/"+id,{method:"DELETE"});admin()}}
async function delAnn(id){if(confirm("Delete announcement?")){await api("/api/announcements/"+id,{method:"DELETE"});admin()}}
async function delLib(id){if(confirm("Delete resource?")){await api("/api/library/"+id,{method:"DELETE"});admin()}}
async function readMsg(id){await api("/api/messages/"+id,{method:"PATCH",body:"{}"});admin()}
async function delMsg(id){if(confirm("Delete message?")){await api("/api/messages/"+id,{method:"DELETE"});admin()}}
</script></body></html>
